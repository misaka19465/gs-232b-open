[platformio]
default_envs = esp32-c3-wroom-02u-n4

[env:esp32-c3-wroom-02u-n4]
platform = espressif32@8.0.0
board = esp32-c3-devkitc-02
framework = espidf

; ESP32-C3-WROOM-02U-N4 has 4 MB of flash.
board_upload.flash_size = 4MB

monitor_speed = 115200
upload_speed = 460800

[env:uart-capture-api-check]
extends = env:esp32-c3-wroom-02u-n4
; NOTE: 仅用于编译/链接验收，强制保留空 app_main 未引用的真实 UART/RMT/NVS 路径。
build_flags =
    -Wl,--undefined=gs232b_esp_uart_open
    -Wl,--undefined=gs232b_esp_uart_boot_service
    -Wl,--undefined=gs232b_nvs_store_port

[env:ethernet-api-check]
extends = env:esp32-c3-wroom-02u-n4
; NOTE: 空 app_main 下仍验证真实 W5500/netif/lwIP 路径的目标链接。
build_flags =
    -Wl,--undefined=gs232b_esp_ethernet_open
    -Wl,--undefined=gs232b_esp_ethernet_recover
    -Wl,--undefined=gs232b_esp_ethernet_configure
    -Wl,--undefined=gs232b_esp_ethernet_service
    -Wl,--undefined=gs232b_esp_ethernet_snapshot
    -Wl,--undefined=gs232b_esp_ethernet_close

[env:wifi-sta-api-check]
extends = env:ethernet-api-check
; NOTE: 同时保留 STA 与 Ethernet，验证独立 netif 及真实 Wi-Fi 驱动链接。
build_flags =
    ${env:ethernet-api-check.build_flags}
    -Wl,--undefined=gs232b_esp_wifi_sta_open
    -Wl,--undefined=gs232b_esp_wifi_sta_configure
    -Wl,--undefined=gs232b_esp_wifi_sta_set_enabled
    -Wl,--undefined=gs232b_esp_wifi_sta_service
    -Wl,--undefined=gs232b_esp_wifi_sta_snapshot
    -Wl,--undefined=gs232b_esp_wifi_sta_close
